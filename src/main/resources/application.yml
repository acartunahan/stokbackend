spring:
  application:
    name: stoktakip-backend
  datasource:
    url: ${TARGET_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${TARGET_DB_USERNAME:stoktakip}
    password: ${TARGET_DB_PASSWORD:stoktakip123}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

server:
  shutdown: graceful
