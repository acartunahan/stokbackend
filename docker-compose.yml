services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: stoktakip-oracle
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    environment:
      ORACLE_PASSWORD: "${ORACLE_PASSWORD:-oracleAdmin123}"
      APP_USER: stoktakip
      APP_USER_PASSWORD: "${TARGET_DB_PASSWORD:-stoktakip123}"
      TZ: Europe/Istanbul
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  oracle-data:
    name: stoktakip-oracle-data
